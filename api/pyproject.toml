[project]
name = "ebookdrop"
version = "0.1.0"
description = "Upload own EPUB and PDF files to a web library"
authors = [
    { name = "nish1013", email = "1642551+nish1013@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
strict = true
packages = ["ebookdrop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
